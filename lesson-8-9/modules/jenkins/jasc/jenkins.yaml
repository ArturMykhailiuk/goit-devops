jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  remotingSecurity:
    enabled: true
  disableRememberMe: false
  numExecutors: 2
  mode: NORMAL
  scm:
    git:
      installations:
        - name: "Default"
          home: "/usr/bin/git"
  credentials:
    system:
      domainCredentials:
        - credentials:
            - usernamePassword:
                scope: GLOBAL
                id: "git-creds"
                username: "<GIT_USERNAME>"
                password: "<GIT_PASSWORD>"
                description: "Git credentials for CI"
  jobs:
    - script: >
        pipelineJob('django-ci') {
          definition {
            cpsScm {
              scm {
                git {
                  remote {
                    url('https://github.com/<your-org>/<your-django-repo>.git')
                    credentials('git-creds')
                  }
                  branches('*/main')
                }
              }
              scriptPath('Jenkinsfile')
            }
          }
        }
