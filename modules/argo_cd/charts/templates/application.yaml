{{- range .Values.applications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name | quote }}
spec:
  project: {{ .project | default "default" | quote }}
  source:
    repoURL: {{ .source.repoURL | quote }}
    targetRevision: {{ .source.targetRevision | quote }}
    path: {{ .source.path | quote }}
    {{- if .source.helm }}
    helm:
      {{- toYaml .source.helm | nindent 6 }}
    {{- end }}
  destination:
    server: {{ .destination.server | quote }}
    namespace: {{ .destination.namespace | quote }}
  {{- if .syncPolicy }}
  syncPolicy:
    {{- toYaml .syncPolicy | nindent 4 }}
  {{- end }}
---
{{- end }}
