persistence:
  enabled: true
  storageClass: gp2
  size: 10Gi

controller:
  image:
    tag: "2.516.2"
  overwritePlugins: true
  installPlugins:
    - configuration-as-code:1985.vdda_32d0c4ea_b_
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - credentials-binding:latest
    - github:latest
    - docker-plugin:latest
    - docker-workflow:latest
    - job-dsl:latest
    - pipeline-stage-view:latest
  admin:
    username: admin
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  JCasC:
    configScripts:
      credentials: |-
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      scope: GLOBAL
                      id: github-token
                      secret: {{ .Values.githubPat }}
                      description: GitHub PAT
      jobs: |-
        jobs:
          - script: >
              job('seed-job') {
                description('Job to generate pipeline for Django project')
                scm {
                  git {
                    remote {
                      url('https://github.com/ArturMykhailiuk/goit-devops.git')
                      credentials('github-token')
                    }
                    branches('*/lesson-8-9')
                  }
                }
                triggers {
                  cron('H/5 * * * *')
                }
                steps {
                  dsl {
                    text('''
                      pipelineJob("goit-django-docker") {
                        triggers {
                          githubPush()
                        }
                        definition {
                            scm {
                              git {
                                remote {
                                  name('goit-devops')
                                  url("https://github.com/ArturMykhailiuk/goit-devops.git")
                                }
                                branches("*/lesson-8-9")
                              }
                            }
                          }
                        }
                      }
                    ''')
                  }
                }
              }
